<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Rota Viva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <a href="index.html" class="back">‹ voltar</a>

  <main class="login-wrap">
    <div class="card">
      <div class="visual">
        <div class="visual-bg"></div>
        <div class="visual-content">
          <div class="rv-logo">
            <span class="rota">Rota</span>
            <span class="viva">Viva</span>
          </div>
          <h2 class="tagline">Viaje e <em>seja feliz</em>.</h2>
          <p class="sub">Entre na sua conta e continue planejando sua próxima aventura.</p>
          <div class="floaties">
            <span class="f f1">✈</span>
            <span class="f f2">🏝</span>
            <span class="f f3">🛏</span>
            <span class="f f4">🎫</span>
          </div>
        </div>
      </div>

      <form class="form" onsubmit="event.preventDefault()">
        <h1>Bem-vindo de volta</h1>
        <p class="hello">Entre com seu e-mail e senha para acessar.</p>

        <label class="field">
          <span>E-mail</span>
          <input type="email" placeholder="voce@email.com" required />
        </label>

        <label class="field">
          <span>Senha</span>
          <input type="password" placeholder="••••••••" required />
        </label>

        <div class="row">
          <label class="check">
            <input type="checkbox" />
            <span class="box"></span>
            Lembrar de mim
          </label>
          <a href="#" class="link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn">Entrar</button>

        <div class="divider"><span>ou continue com</span></div>

        <div class="socials">
          <button type="button" class="soc">G</button>
          <button type="button" class="soc">f</button>
          <button type="button" class="soc"></button>
        </div>

        <p class="signup">Ainda não tem conta? <a href="#">Cadastre-se</a></p>
      </form>
    </div>
  </main>
</body>
</html>
